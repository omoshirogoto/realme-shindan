<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今のあなたに必要なのは『整える？進む？』診断</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root {
      --mincho: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho,
                "Noto Serif JP", "Noto Serif CJK JP", "MS PMincho", serif;
      --serif-en: Georgia, "Times New Roman", serif;
      --color-logo:      #001858;  /* REALMEロゴ文字のみ */
      --color-heading:   #2E2A45;  /* 見出し・タイプ名・質問文 */
      --color-text:      #6E6980;  /* 本文・選択肢ラベル・ゲージのラベル */
      --color-muted:     #74707F;  /* 注記 */
      --color-gold-text: #8A6E2E;  /* タグライン */
      --color-gold-rule: #D9BE7A;  /* 細い罫線 */
      --color-rose:      #B94F74;  /* 主ボタン。文字は白 */
      --color-setonoeru: #9FCDE9;  /* 整える力ゲージ */
      --color-susumu:    #EFA2BC;  /* 進む力ゲージ */
      --color-track:     #EFEDF2;  /* ゲージ・進捗バーの下地 */
      --color-border:    #E3DFE8;  /* カード・選択肢ボタンの枠線 */
      --color-white:     #FFFFFF;
    }
    body {
      font-family: var(--mincho);
      color: var(--color-text);
      background: linear-gradient(178deg, #EDF5FB 0%, #FFFFFF 46%, #FCEFF3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .screen {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    h1, h2, h3 {
      color: var(--color-heading);
      text-align: center;
      margin-top: 0;
      line-height: 1.85;
      font-weight: 500;
    }
    button, .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary {
      background-color: var(--color-rose);
      color: #FFFFFF;
      height: 58px;
      line-height: 58px;
      font-weight: bold;
      margin-bottom: 16px;
      border-radius: 29px;
      box-shadow: 0 5px 16px rgba(185,79,116,.26);
      font-family: var(--mincho);
    }
    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--color-rose);
      border: 2px solid var(--color-rose);
      height: 58px;
      line-height: 54px;
      font-weight: bold;
      margin-bottom: 16px;
      border-radius: 29px;
      font-family: var(--mincho);
    }
    .btn-outline {
      background-color: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-border);
      height: 58px;
      line-height: 56px;
      font-weight: bold;
      margin-bottom: 16px;
      border-radius: 29px;
      font-family: var(--mincho);
    }
    .btn:disabled {
      background-color: var(--color-border);
      cursor: not-allowed;
    }
    /* Logo area */
    .logo-container {
      text-align: center;
      margin-bottom: 0;
    }
    .logo-container img {
      max-width: 200px;
      height: auto;
    }
    .logo-text {
      font-size: 34px;
      font-family: var(--serif-en);
      letter-spacing: 6px;
      color: var(--color-logo);
      display: inline-block;
    }
    .tagline {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 13px;
      color: var(--color-gold-text);
      letter-spacing: 1.5px;
      text-align: center;
      margin-top: 7px;
      margin-bottom: 0;
    }
    .tagline::after {
      content: '';
      display: block;
      width: 44px;
      height: 1px;
      background: var(--color-gold-rule);
      margin: 22px auto 32px;
    }
    /* Theme grid */
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .theme-grid .btn-theme {
      background-color: #FFFFFF;
      color: var(--color-text);
      min-height: 56px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-border);
    }
    .theme-grid .btn-theme.selected {
      background-color: var(--color-rose);
      color: #FFFFFF;
    }
    .theme-grid .btn-theme.full-width {
      grid-column: 1 / -1;
    }
    /* Question area */
    .progress-text {
      text-align: center;
      font-size: 14px;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      background-color: var(--color-track);
      height: 14px;
      border-radius: 7px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background-color: var(--color-gold-rule);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
      border-radius: 7px;
    }
    .question-text {
      font-size: 18px;
      line-height: 1.85;
      text-align: center;
      margin-bottom: 32px;
      font-weight: 500;
      color: var(--color-heading);
    }
    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }
    .btn-answer {
      background-color: #FFFFFF;
      color: var(--color-text);
      min-height: 48px;
      border: 1px solid var(--color-border);
      padding: 8px 16px;
    }
    .text-link {
      display: block;
      text-align: center;
      color: var(--color-text);
      text-decoration: underline;
      font-size: 14px;
      margin-top: 24px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px;
    }
    /* Result area */
    .result-theme {
      text-align: center;
      font-size: 15px;
      font-weight: normal;
      margin-bottom: 8px;
    }
    .result-type {
      text-align: center;
      font-size: 32px;
      font-weight: 500;
      color: var(--color-heading);
      margin-bottom: 32px;
      line-height: 1.85;
    }
    .gauge-container {
      margin-bottom: 24px;
    }
    .gauge-label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .gauge-bg {
      background-color: var(--color-track);
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 7px;
    }
    .result-card {
      background-color: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px 16px;
      margin-top: 32px;
      margin-bottom: 32px;
    }
    .result-section {
      margin-bottom: 24px;
    }
    .result-section:last-child {
      margin-bottom: 0;
    }
    .result-section h3 {
      font-size: 16px;
      text-align: left;
      border-left: 4px solid var(--color-gold-rule);
      padding-left: 8px;
      margin-bottom: 8px;
    }
    .result-section p {
      font-size: 15px;
      margin: 0;
    }
    .cta-area {
      margin-top: 32px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .share-area {
      margin-top: 24px;
      margin-bottom: 32px;
    }
    .msg-alert {
      text-align: center;
      color: var(--color-rose);
      font-weight: bold;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- スタート画面 -->
  <div id="screen-start" class="screen" style="display: block;">
    <div class="logo-container" id="logo-container"></div>
    <div class="tagline">Realize Me, Live My Essentials</div>
    <h1 id="start-title"></h1>
    <p style="text-align: center; margin-bottom: 32px;">整える力と進む力 / 全16問・約3〜4分</p>
    <div id="start-msg" class="msg-alert" style="display: none;">準備中です</div>
    <button id="btn-start" class="btn btn-primary" onclick="showScreen('theme')">診断スタート</button>
  </div>

  <!-- テーマ選択画面 -->
  <div id="screen-theme" class="screen">
    <h2>今、一番気になっているテーマは？</h2>
    <div class="theme-grid">
      <button class="btn btn-theme" onclick="selectTheme('仕事')">仕事</button>
      <button class="btn btn-theme" onclick="selectTheme('お金')">お金</button>
      <button class="btn btn-theme" onclick="selectTheme('時間')">時間</button>
      <button class="btn btn-theme" onclick="selectTheme('人間関係')">人間関係</button>
      <button class="btn btn-theme" onclick="selectTheme('パートナー・家族')">パートナー・家族</button>
      <button class="btn btn-theme" onclick="selectTheme('健康・身体')">健康・身体</button>
      <button class="btn btn-theme" onclick="selectTheme('自分自身')">自分自身</button>
      <button class="btn btn-theme" onclick="selectTheme('夢・これから')">夢・これから</button>
      <button class="btn btn-theme full-width" onclick="selectTheme('その他')">その他</button>
    </div>
  </div>

  <!-- 質問画面 -->
  <div id="screen-question" class="screen">
    <div class="progress-text" id="progress-text">Q1 / 16</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="answer-list">
      <button class="btn btn-answer" onclick="answerQuestion(5)">5 とても当てはまる</button>
      <button class="btn btn-answer" onclick="answerQuestion(4)">4 まあ当てはまる</button>
      <button class="btn btn-answer" onclick="answerQuestion(3)">3 どちらともいえない</button>
      <button class="btn btn-answer" onclick="answerQuestion(2)">2 あまり当てはまらない</button>
      <button class="btn btn-answer" onclick="answerQuestion(1)">1 まったく当てはまらない</button>
    </div>
    <button id="link-reset-theme" class="text-link" onclick="resetTheme()" style="display: none;">テーマを選び直す</button>
    <button id="link-prev" class="text-link" onclick="prevQuestion()" style="display: none;">前の質問に戻る</button>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <div class="result-theme" id="result-theme-text"></div>
    <div class="result-type" id="result-type-name"></div>
    
    <div class="gauge-container">
      <div class="gauge-label">
        <span>整える力</span>
        <span id="result-score-setonoeru"></span>
      </div>
      <div class="gauge-bg">
        <div class="gauge-fill" id="gauge-setonoeru"></div>
      </div>
    </div>
    <div class="gauge-container">
      <div class="gauge-label">
        <span>進む力</span>
        <span id="result-score-susumu"></span>
      </div>
      <div class="gauge-bg">
        <div class="gauge-fill" id="gauge-susumu"></div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-section">
        <h3>今のあなたの状態</h3>
        <p id="result-state"></p>
      </div>
      <div class="result-section">
        <h3>あなたの強み</h3>
        <p id="result-strength"></p>
      </div>
      <div class="result-section">
        <h3>今起こりやすいこと</h3>
        <p id="result-tendency"></p>
      </div>
      <div class="result-section">
        <h3>今、大切にするといいこと</h3>
        <p id="result-care"></p>
      </div>
      <div class="result-section">
        <h3>今日からできる小さな一歩</h3>
        <p id="result-step"></p>
      </div>
    </div>

    <div class="cta-area">
      <a id="btn-form" class="btn btn-primary" target="_blank" rel="noopener">私の場合をもう少し整理したい</a>
      <a id="btn-line" class="btn btn-secondary" target="_blank" rel="noopener">整える・夢を叶えるヒントを受け取る</a>
    </div>

    <div class="share-area">
      <button id="btn-share" class="btn btn-outline">この診断をシェアする</button>
    </div>

    <button class="text-link" onclick="resetState()">もう一度診断する</button>
  </div>
</div>

<script>
  function _h(tagName, attrs, ...children) {
    const el = document.createElement(tagName);
    for (let k in attrs) {
      if (k.startsWith('on')) {
        el.addEventListener(k.substring(2).toLowerCase(), attrs[k]);
      } else {
        el.setAttribute(k, attrs[k]);
      }
    }
    children.forEach(function(c) {
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
    return el;
  }

  const CONFIG = {
    THRESHOLD: 28,
    GAS_ENDPOINT: 'https://script.google.com/macros/s/AKfycbxlabBGMXUt3v7Uk5dKIvMRSwYvi6LULDg843q2Yp7K7DV4cB69QIr5eVoPGvcn-HST/exec',  // テスト環境。納品時に伊藤さんのデプロイURLへ差し替える
    URL_FORM: 'https://forms.gle/xLossqMi5GkJo1hC7',
    URL_LINE: 'https://lin.ee/Pk02zOT',
    TITLE: '',
    COLOR_SETONOERU: '#9FCDE9',
    COLOR_SUSUMU: '#EFA2BC',
    LOGO_URL: '',
    SHARE_TEXT: 'REALMEの診断を受けてみました。あなたはどのタイプ？'
  };

  const TYPES = {
    next: {
      name: '次のステージ準備タイプ',
      state: '心と体の状態も整っていて、これから次のステージへ進む準備ができている時期のようです。新しい役職や責任を担う、もっと大きな目標に向かっていく、そういう時期にいるのかもしれません。',
      strength: '心身が整っているからこそ、夢や目標に向かって行動できます。やりたいことが明確で、それを実現するための行動も続けられています。',
      tendency: '責任や影響力が大きくなる時期だからこそ、「本当に大切にしたいことは何か」「どんな自分でありたいか」を見失いやすいことがあります。多忙の中で、自分の軸を見落とすことも。',
      care: '次のステージに進む前に、「自分の価値観」「何のために進むのか」をもう一度丁寧に確認してみてください。その軸があれば、どんな責任の大きさでも、自分らしく進めます。',
      step: '1年後、こうなっていたら最高！と思うことを3つ書いてみましょう。'
    },
    leader: {
      name: '頑張りすぎリーダータイプ',
      state: '人のためにしっかり動けている一方、自分のことは後回しにしやすい時期なのかもしれません。心と体を整える余裕が、今はちょっと少なくなっているようです。',
      strength: '責任感が強く、人のために行動できる力を持っています。周りをしっかり支える行動ができ、その力が周りからの信頼につながっています。',
      tendency: '休んでいるときも仕事のことが頭から離れなかったり、疲れていても「まだ頑張らなきゃ」と自分を後押ししたり。休んだつもりでも、体と心が本当には休みきれていないことがあります。',
      care: '自分を整えることは、周りのためにもなります。自分の健康や好きなことを大切にする時間を、ちょっと増やしてみてください。そこから、もっと力が湧いてくるはずです。',
      step: '今日30分、自分のためだけに時間を使うとしたら何をしたいですか？'
    },
    dream: {
      name: '夢を見つける一歩目タイプ',
      state: '心と体が整っているからこそ、「では、本当にやりたいことって何だろう？」という問いが浮かんでくるのかもしれません。今は、自分が本当に好きなこと、ワクワクすることを探す時期のようです。',
      strength: '心と体が整っているあなたは、今から新しいことに挑戦できる土台が整っています。「やってみたい」「好きかもしれない」と感じたことを試す準備が、すでにできているのです。',
      tendency: '心に余裕はあるのに、「何をしたいのか」がピンとこないことがあります。また、やってみたいことがあっても「こんなことでいいのかな」と二の足を踏んでしまうことも。',
      care: '自分の「好き」「楽しい」「ワクワク」という感覚を大事にしてみてください。それが本当の夢につながるヒントになります。最初は小さなことから始めても大丈夫です。',
      step: '時間もお金も気にしなくていいなら、やってみたいことを10個書いてみましょう。'
    },
    restart: {
      name: '自分に還る再スタートタイプ',
      state: '毎日のことに追われて、自分がどうしたいのか、何を感じているのかが見えにくくなっている時期のようです。立ち止まって、自分の気持ちと向き合う時間が今、必要なのかもしれません。',
      strength: '今は見えていなくても、あなたの中には本当にやりたいこと、ワクワクできることがちゃんとあります。まずは自分に還る時間をつくることで、その感覚が戻ってくるはずです。',
      tendency: '次々と来る仕事や役割の中で、自分の気持ちが置き去りになっていることがあります。疲れているのに気づきにくかったり、何がしたいのか考える余裕が失われているかもしれません。',
      care: '無理に次の目標を決めるより、今は「立ち止まる」「休む」「感じる」が大事です。自分の本当の気持ちを聞くところから始めてみてください。その先に、次のステップが見えてきます。',
      step: '最近、本当は嫌だったこと／嬉しかったことを1つずつ書いてみましょう。'
    }
  };

  const QUESTIONS = [
    { text: '自分のためにゆっくり過ごす時間を取れています。', rev: false },
    { text: '疲れているときは、無理をせず休むことができます。', rev: false },
    { text: '今の自分がどんな気持ちなのか、立ち止まって感じる時間があります。', rev: false },
    { text: '心や身体の状態に合わせて、予定や行動を調整できます。', rev: false },
    { text: '人から頼まれると、自分の予定を後回しにしてしまうことがあります。', rev: true },
    { text: '仕事や役割のことが、休んでいるときも頭から離れません。', rev: true },
    { text: '「まだ頑張らなきゃ」と、自分に無理をさせることがあります。', rev: true },
    { text: '自分の健康・家族・好きなことより、周りの期待を優先することがあります。', rev: true },
    { text: '1〜3年後、どんな自分になっていたいかイメージできます。', rev: false },
    { text: '今、本当にやってみたいことがあります。', rev: false },
    { text: '自分が大切にしたい価値観や生き方を言葉にできます。', rev: false },
    { text: '夢や目標のために、今何をすればいいかわかっています。', rev: false },
    { text: '小さくても、未来につながる行動を続けています。', rev: false },
    { text: '今より一段上のステージへ挑戦したいと感じています。', rev: false },
    { text: 'やりたいことはあるのに、「難しそう」「無理かも」と止まってしまうことがあります。', rev: true },
    { text: '毎日が目の前のことで終わり、未来のための時間を取れていません。', rev: true }
  ];

  let currentQuestion = 0;
  let answers = [];
  let selectedTheme = '';
  let sessionCount = 0;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(el) {
      el.style.display = 'none';
    });
    document.getElementById('screen-' + id).style.display = 'block';
    window.scrollTo(0, 0);
  }

  function applySettings(data) {
    const map = {
      '診断名':              'TITLE',
      '個別相談フォームURL': 'URL_FORM',
      '公式LINE URL':        'URL_LINE',
      '整える力の色':        'COLOR_SETONOERU',
      '進む力の色':          'COLOR_SUSUMU',
      'ロゴ画像URL':         'LOGO_URL',
      '共有メッセージ':      'SHARE_TEXT',
    };
    Object.keys(map).forEach(function(sheetKey) {
      const configKey = map[sheetKey];
      const val = data[sheetKey];
      if (val !== undefined && val !== '') CONFIG[configKey] = val;
    });
    const threshold = parseInt(data['判定の基準点'], 10);
    if (!isNaN(threshold)) CONFIG.THRESHOLD = threshold;
  }

  function loadSettings(onComplete) {
    if (!CONFIG.GAS_ENDPOINT) { onComplete(); return; }

    const callbackName = 'realmeCb_' + Date.now();
    let done = false;

    const timer = setTimeout(function() {
      if (!done) { done = true; onComplete(); }
    }, 3000);

    window[callbackName] = function(data) {
      clearTimeout(timer);
      if (!done) { done = true; applySettings(data); onComplete(); }
    };

    const script = document.createElement('script');
    script.src = CONFIG.GAS_ENDPOINT + '?callback=' + callbackName;
    script.onerror = function() {
      if (!done) { done = true; clearTimeout(timer); onComplete(); }
    };
    document.head.appendChild(script);
  }

  function checkConfig() {
    let ok = true;
    if (!CONFIG.TITLE) ok = false;
    if (!CONFIG.GAS_ENDPOINT) ok = false;
    if (!CONFIG.URL_FORM) ok = false;
    if (!CONFIG.URL_LINE) ok = false;
    
    Object.keys(TYPES).forEach(function(k) {
      const t = TYPES[k];
      if (!t.state || !t.strength || !t.tendency || !t.care) ok = false;
    });

    const startTitle = document.getElementById('start-title');
    startTitle.textContent = CONFIG.TITLE || '今のあなたに必要なのは『整える？進む？』診断';
    document.title = startTitle.textContent;

    const logoContainer = document.getElementById('logo-container');
    logoContainer.innerHTML = '';
    if (CONFIG.LOGO_URL) {
      const img = document.createElement('img');
      img.src = CONFIG.LOGO_URL;
      img.alt = 'REALME';
      logoContainer.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.className = 'logo-text';
      span.textContent = 'REALME';
      logoContainer.appendChild(span);
    }

    if (!ok) {
      document.getElementById('start-msg').style.display = 'block';
      document.getElementById('btn-start').disabled = true;
    }
  }

  function selectTheme(theme) {
    selectedTheme = theme;
    showQuestion();
    showScreen('question');
  }

  function showQuestion() {
    document.getElementById('progress-text').textContent = 'Q' + (currentQuestion + 1) + ' / 16';
    document.getElementById('progress-bar-fill').style.width = (currentQuestion / 16 * 100) + '%';
    document.getElementById('question-text').textContent = QUESTIONS[currentQuestion].text;

    if (currentQuestion === 0) {
      document.getElementById('link-reset-theme').style.display = 'block';
      document.getElementById('link-prev').style.display = 'none';
    } else {
      document.getElementById('link-reset-theme').style.display = 'none';
      document.getElementById('link-prev').style.display = 'block';
    }
  }

  function answerQuestion(val) {
    answers[currentQuestion] = val;
    currentQuestion++;
    if (currentQuestion === 16) {
      finishQuiz();
    } else {
      showQuestion();
    }
  }

  function prevQuestion() {
    currentQuestion--;
    answers[currentQuestion] = undefined;
    document.getElementById('progress-bar-fill').style.width = (currentQuestion / 16 * 100) + '%';
    showQuestion();
  }

  function resetTheme() {
    answers = [];
    currentQuestion = 0;
    showScreen('theme');
  }

  function calcScore() {
    let setonoeru = 0;
    let susumu = 0;
    for (let i = 0; i < 16; i++) {
      let val = answers[i];
      if (QUESTIONS[i].rev) {
        val = 6 - val;
      }
      if (i < 8) {
        setonoeru += val;
      } else {
        susumu += val;
      }
    }
    return { setonoeru: setonoeru, susumu: susumu };
  }

  function judge(setonoeru, susumu) {
    if (setonoeru >= CONFIG.THRESHOLD && susumu >= CONFIG.THRESHOLD) { return 'next'; }
    else if (setonoeru < CONFIG.THRESHOLD && susumu >= CONFIG.THRESHOLD) { return 'leader'; }
    else if (setonoeru >= CONFIG.THRESHOLD && susumu < CONFIG.THRESHOLD) { return 'dream'; }
    else { return 'restart'; }
  }

  function finishQuiz() {
    const scores = calcScore();
    const type = judge(scores.setonoeru, scores.susumu);
    sessionCount++;
    
    const resultToSave = {
      theme: selectedTheme,
      setonoeru: scores.setonoeru,
      susumu: scores.susumu,
      type: type
    };
    sessionStorage.setItem('realme_result', JSON.stringify(resultToSave));

    const payload = {
      theme: selectedTheme,
      setonoeru: scores.setonoeru,
      susumu: scores.susumu,
      type: type,
      threshold: CONFIG.THRESHOLD,
      sessionCount: sessionCount,
      answers: answers
    };
    sendData(payload);

    renderResult(scores.setonoeru, scores.susumu, type, selectedTheme);
  }

  function renderResult(setonoeru, susumu, type, theme) {
    document.getElementById('result-theme-text').textContent = 'あなたが今気になっているのは『' + theme + '』について';
    document.getElementById('result-type-name').textContent = '今のあなたは ' + TYPES[type].name + ' です';
    
    document.getElementById('result-score-setonoeru').textContent = setonoeru + '/40';
    document.getElementById('gauge-setonoeru').style.width = (setonoeru / 40 * 100) + '%';
    document.getElementById('gauge-setonoeru').style.backgroundColor = CONFIG.COLOR_SETONOERU || '#9FCDE9';
    
    document.getElementById('result-score-susumu').textContent = susumu + '/40';
    document.getElementById('gauge-susumu').style.width = (susumu / 40 * 100) + '%';
    document.getElementById('gauge-susumu').style.backgroundColor = CONFIG.COLOR_SUSUMU || '#EFA2BC';

    document.getElementById('result-state').textContent = TYPES[type].state;
    document.getElementById('result-strength').textContent = TYPES[type].strength;
    document.getElementById('result-tendency').textContent = TYPES[type].tendency;
    document.getElementById('result-care').textContent = TYPES[type].care;
    document.getElementById('result-step').textContent = TYPES[type].step;

    document.getElementById('btn-form').href = CONFIG.URL_FORM;
    document.getElementById('btn-line').href = CONFIG.URL_LINE;
    
    if (!CONFIG.URL_FORM) document.getElementById('btn-form').style.display = 'none';
    if (!CONFIG.URL_LINE) document.getElementById('btn-line').style.display = 'none';

    if (navigator.share) {
      document.getElementById('btn-share').addEventListener('click', function() {
        navigator.share({
          text: CONFIG.SHARE_TEXT,
          url: window.location.href,
        }).catch(function() {});
      });
    } else {
      document.getElementById('btn-share').style.display = 'none';
    }

    showScreen('result');
  }

  function sendData(payload) {
    try {
      fetch(CONFIG.GAS_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    } catch (e) {}
  }

  function resetState() {
    answers = [];
    currentQuestion = 0;
    selectedTheme = '';
    sessionStorage.removeItem('realme_result');
    showScreen('start');
  }

  function init() {
    const saved = sessionStorage.getItem('realme_result');
    if (saved) {
      loadSettings(function() {
        checkConfig();
        const r = JSON.parse(saved);
        renderResult(r.setonoeru, r.susumu, r.type, r.theme);
      });
    } else {
      loadSettings(function() {
        checkConfig();
      });
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
